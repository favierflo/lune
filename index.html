<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lune</title>
  <meta name="description" content="Suivi de cycle menstruel simple et privé. Tes données restent sur ton téléphone.">
  <meta name="theme-color" content="#FBF7F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141015" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lune">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Applique le thème choisi avant l'affichage (évite un flash de couleur au démarrage)
    try { var t = JSON.parse(localStorage.getItem('lune:v1')).settings.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="status-scrim" aria-hidden="true"></div>
  <main id="view" class="view" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" aria-label="Navigation"></nav>
  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-input" type="file" accept="application/json,.json" hidden>
  <noscript>Lune a besoin de JavaScript pour fonctionner.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
